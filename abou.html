<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Eyasin's Portfolio</title>
    <style>
        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9f9f9;
        }

        /* --- About Section & Responsive Backgrounds --- */
        .about-wrapper {
            position: relative;
            width: 100%;
            height: auto;
            
            /* Mobile Version: 1920x2400 Ratio */
            aspect-ratio: 1920 / 2400; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            /* Dummy path for Mobile Background */
            background-image: url('assets/about-mobile.png'); 
        }

        /* Desktop Version */
        @media (min-width: 768px) {
            .about-wrapper {
                /* Desktop Version: 2400x1786 Ratio */
                aspect-ratio: 2400 / 1786;
                
                /* Dummy path for Desktop Background */
                background-image: url('assets/about-desktop.png');
            }
        }

        /* --- Top Center Navigation --- */
        .nav-container {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Hamburger Menu Icon --- */
        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 32px;
            height: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 51;
        }

        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #333; 
            border-radius: 2px;
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
        }

        /* Collapse Animation (Transforms to 'X') */
        .hamburger.active span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        /* --- Minimalist Glassmorphism Dropdown Menu --- */
        .dropdown-menu {
            position: absolute;
            top: 40px;
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            padding: 1rem 0;
            min-width: 200px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            
            /* Hidden state */
            opacity: 0;
            pointer-events: none;
            transform: translateY(-15px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Active state */
        .dropdown-menu.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .dropdown-menu ul {
            list-style: none;
        }

        .dropdown-menu li {
            margin: 0;
        }

        /* Updated hrefs to navigate between standard page files */
        .dropdown-menu a {
            display: block;
            padding: 12px 24px;
            text-decoration: none;
            color: #1a1a1a;
            font-size: 0.95rem;
            font-weight: 500;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .dropdown-menu a:hover {
            background-color: rgba(0, 0, 0, 0.04);
            color: #000;
        }
    </style>
</head>
<body>

    <section class="about-wrapper">
        <!-- Top Center Menu Container -->
        <div class="nav-container">
            <!-- Toggle Button -->
            <button class="hamburger" id="menuToggle" aria-label="Toggle dropdown menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <!-- Dropdown Options linked for multi-page routing -->
            <nav class="dropdown-menu" id="dropdownMenu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="work.html">Work</a></li>
                    <li><a href="project.html">Project</a></li>
                    <li><a href="credentials.html">Credentials</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
        
        <!-- About Me Content can be placed inside this wrapper so it overlays the background -->
        
    </section>

    <script>
        // --- Navigation Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.getElementById('menuToggle');
            const dropdownMenu = document.getElementById('dropdownMenu');

            menuToggle.addEventListener('click', (e) => {
                // Prevent click from immediately bubbling up to the document
                e.stopPropagation(); 
                
                // Toggle active classes on both the icon and the menu
                menuToggle.classList.toggle('active');
                dropdownMenu.classList.toggle('active');
            });

            // Close dropdown when clicking anywhere outside of it
            document.addEventListener('click', (event) => {
                if (!dropdownMenu.contains(event.target) && !menuToggle.contains(event.target)) {
                    menuToggle.classList.remove('active');
                    dropdownMenu.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
