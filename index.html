<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyasin's Portfolio</title>
    <style>
        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            /* Enables smooth gliding when clicking menu links */
            scroll-behavior: smooth; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9f9f9;
        }

        /* --- Navigation (Fixed for Single Page) --- */
        .nav-container {
            position: fixed; /* Keeps menu on screen while scrolling */
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999; /* Ensures it stays above all backgrounds */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Hamburger Menu Icon --- */
        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 32px;
            height: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 1000;
        }

        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #333; 
            border-radius: 2px;
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
        }

        /* Collapse Animation (Transforms to 'X') */
        .hamburger.active span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        /* --- Minimalist Glassmorphism Dropdown Menu --- */
        .dropdown-menu {
            position: absolute;
            top: 40px;
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            padding: 1rem 0;
            min-width: 200px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            
            /* Hidden state */
            opacity: 0;
            pointer-events: none;
            transform: translateY(-15px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Active state */
        .dropdown-menu.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .dropdown-menu ul {
            list-style: none;
        }

        .dropdown-menu li {
            margin: 0;
        }

        .dropdown-menu a {
            display: block;
            padding: 12px 24px;
            text-decoration: none;
            color: #1a1a1a;
            font-size: 0.95rem;
            font-weight: 500;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .dropdown-menu a:hover {
            background-color: rgba(0, 0, 0, 0.04);
            color: #000;
        }

        /* --- SECTION 1: Hero --- */
        #home {
            position: relative;
            width: 100%;
            height: 100vh; /* Phone default */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: url('assets/Untitled design (1).png'); 
        }

        @media (min-width: 768px) {
            #home {
                height: auto;
                aspect-ratio: 2400 / 1786; /* Matches image perfectly */
                background-size: cover; 
                background-image: url('assets/1779516068636.png');
            }
        }

        /* --- SECTION 2: About --- */
        #about {
            position: relative;
            width: 100%;
            height: auto;
            aspect-ratio: 1920 / 2400; /* Mobile ratio */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: url('assets/nice to meet you! (2).png'); 
        }

        @media (min-width: 768px) {
            #about {
                aspect-ratio: 2400 / 1786; /* Desktop ratio */
                background-image: url('assets/nice to meet you! (3).png');
            }
        }
    </style>
</head>
<body>

    <!-- Fixed Global Navigation -->
    <div class="nav-container">
        <button class="hamburger" id="menuToggle" aria-label="Toggle dropdown menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <!-- Dropdown Options using ID anchors for single-page routing -->
        <nav class="dropdown-menu" id="dropdownMenu">
            <ul>
                <li><a href="#home" class="nav-link">Home</a></li>
                <li><a href="#about" class="nav-link">About</a></li>
                <li><a href="#work" class="nav-link">Work</a></li>
                <li><a href="#project" class="nav-link">Project</a></li>
                <li><a href="#credentials" class="nav-link">Credentials</a></li>
                <li><a href="#blog" class="nav-link">Blog</a></li>
                <li><a href="#contact" class="nav-link">Contact</a></li>
            </ul>
        </nav>
    </div>

    <!-- Page Content -->
    <main>
        <!-- Hero Section -->
        <section id="home">
            <!-- Hero content goes here -->
        </section>

        <!-- About Section -->
        <section id="about">
            <!-- About content goes here -->
        </section>

        <!-- Future Sections (Work, Project, etc.) will go here with matching IDs -->
    </main>

    <script>
        // --- Single Page Navigation Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.getElementById('menuToggle');
            const dropdownMenu = document.getElementById('dropdownMenu');
            const navLinks = document.querySelectorAll('.nav-link');

            // 1. Toggle menu open/close
            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation(); 
                menuToggle.classList.toggle('active');
                dropdownMenu.classList.toggle('active');
            });

            // 2. Close dropdown when clicking outside
            document.addEventListener('click', (event) => {
                if (!dropdownMenu.contains(event.target) && !menuToggle.contains(event.target)) {
                    menuToggle.classList.remove('active');
                    dropdownMenu.classList.remove('active');
                }
            });

            // 3. Close menu automatically when a link is clicked
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    menuToggle.classList.remove('active');
                    dropdownMenu.classList.remove('active');
                });
            });
        });
    </script>
</body>
</html>
