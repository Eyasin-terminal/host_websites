<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyasin's Portfolio</title>
    <style>
        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9f9f9;
        }

        /* --- Hero Section --- */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh; /* Full viewport height */
            /* Dummy 16:9 Image (1920x1080) */
            background-image: url('https://dummyimage.com/1920x1080/e5e5e5/999999.png&text=16:9+Hero+Background');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* --- Top Center Navigation --- */
        .nav-container {
            position: absolute;
            top: 24px; /* Padding from the top edge */
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }

        /* --- Hamburger Menu Icon --- */
        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 32px;
            height: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        /* The 3 bars */
        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #333; /* Dark minimalist gray */
            border-radius: 2px;
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
        }

        /* Collapse Animation (Transforms into an 'X' when active) */
        .hamburger.active span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }
    </style>
</head>
<body>

    <section class="hero">
        <!-- Top Center Menu Container -->
        <div class="nav-container">
            <button class="hamburger" id="menuToggle" aria-label="Toggle dropdown menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        
        <!-- Future dropdown content can be placed here or triggered via JS -->
    </section>

    <script>
        // --- Navigation Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.getElementById('menuToggle');

            menuToggle.addEventListener('click', () => {
                // Toggles the 'active' class to animate the 3-bar icon into an 'X'
                menuToggle.classList.toggle('active');
                
                // Logic to reveal/hide the dropdown menu will go here
                console.log('Menu toggled. Dropdown logic pending.');
            });
        });
    </script>
</body>
</html>
